name: Feature request
description: Suggest an improvement to VeloxScreen.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for contributing ideas. The project is an early alpha and implementation is not guaranteed.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Printer/display configuration (optional)
      placeholder: e.g. IDEX, 4.3-inch 800x480 touchscreen
